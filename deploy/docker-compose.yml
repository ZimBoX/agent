# Продакшн-развёртывание на сервере (Ubuntu 24.04). Поднимает Postgres и бэкенд.
# Секреты и настройки берутся из файла .env рядом (см. .env.example).
#
#   cd deploy && docker compose up -d --build
#
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: claude_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Бэкенд накатывает миграции при старте — стартовать он должен только после
      # того, как Postgres реально готов принимать соединения, иначе Migrate() падает.
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_assistant"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Строка подключения к контейнеру Postgres (хост = имя сервиса compose).
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=claude_assistant;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}"
      # Агрегатор (в Production этих ключей нет в appsettings.json — задаём тут).
      Aggregator__BaseUrl: "https://api.aitunnel.ru/v1"
      Aggregator__NativeBaseUrl: "https://api.aitunnel.ru"
      Aggregator__UseNativeSdk: "true"
      # Модель «режима чата» (лёгкая, отдельно от основного потока). Меняется без
      # пересборки — просто правкой этой строки и рестартом.
      Chat__Model: "gemini-3-flash-preview"
      # Секреты — из .env (обязательны, поднятие упадёт, если не заданы).
      AITUNNEL_API_KEY: ${AITUNNEL_API_KEY:?AITUNNEL_API_KEY не задан в .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD не задан в .env}
      # Поиск файлов по объекту: граница доступа (папка-объект обязана лежать внутри)
      # и трансляция UNC-путей клиента в точку монтирования шары archive-office.
      # Шара arhiv-gsfs (\\archive-office = 192.168.0.21) смонтирована на хосте в
      # /mnt/synology/arhiv-gsfs и проброшена ниже read-only.
      ProjectFiles__Root: /mnt/synology/arhiv-gsfs
      ProjectFiles__UncMappings__0__Unc: "\\\\archive-office\\arhiv-gsfs"
      ProjectFiles__UncMappings__0__Local: /mnt/synology/arhiv-gsfs
      ProjectFiles__UncMappings__1__Unc: "\\\\192.168.0.21\\arhiv-gsfs"
      ProjectFiles__UncMappings__1__Local: /mnt/synology/arhiv-gsfs
      # Кэш рендеров чертежей (PNG-вырезки/монтажи/постраничный текст) — ускоряет
      # повторное чтение объекта. Лимит размера — см. Render:CacheMaxBytes в коде.
      Render__CacheDir: /app/render-cache
      # Временная песочница больших пачек вложений: файлы, загруженные пользователем,
      # раскладываются сюда и читаются моделью инструментами (по частям + зум) вместо
      # инлайна. Свежие чистятся фоновым свипом (см. AttachedFilesCleanupService).
      AttachedFiles__CacheDir: /app/attached-cache
    ports:
      - "5149:5149"
    volumes:
      # Загруженные через админку билды клиента (release-фид Velopack) должны
      # переживать пересоздание контейнера.
      - releases_data:/app/releases
      # Кэш рендеров чертежей — переживает пересоздание контейнера.
      - render_cache:/app/render-cache
      # Временная песочница вложений (эфемерна, чистится свипом; том — чтобы диск
      # контейнера не пух и переживать пересоздание в пределах ретеншена).
      - attached_cache:/app/attached-cache
      # Файловые логи Serilog (LocalApplicationData у root внутри контейнера).
      - backend_logs:/root/.local/share/ClaudeAssistant/backend-logs
      # Шара с папками объектов (смонтирована на хосте, см. deploy/README раздел 6),
      # read-only — бэкенд файлы только читает.
      - /mnt/synology:/mnt/synology:ro

volumes:
  postgres_data:
  releases_data:
  render_cache:
  attached_cache:
  backend_logs:
